<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - 404</title>
    <style>
        /* CSS ekhanei add kore deya hoyeche */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f7f9fc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #333;
        }

        .error-container {
            text-align: center;
            padding: 20px;
            max-width: 500px;
        }

        .error-code {
            font-size: 120px;
            font-weight: 900;
            color: #4f46e5; /* Primary purple/blue color */
            line-height: 1;
            margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 15px;
            color: #1e1b4b;
        }

        p {
            font-size: 16px;
            color: #6b7280;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .home-btn {
            display: inline-block;
            padding: 12px 30px;
            background-color: #4f46e5;
            color: white;
            text-decoration: none;
            border-radius: 25px;
            font-weight: 600;
            transition: background-color 0.3s ease, transform 0.2s ease;
            box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.2);
        }

        .home-btn:hover {
            background-color: #4338ca;
            transform: translateY(-2px);
        }

        /* 404 texttar floating animation */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
    </style>
</head>
<body>

    <div class="error-container">
        <div class="error-code">404</div>
        
        <h1>ওপস! পাতাটি খুঁজে পাওয়া যায়নি</h1>
        <p>আপনি যে পৃষ্ঠাটি খুঁজছেন তা খুঁজে পাওয়া  যায় নি।</p>
        
        <a href="/" class="home-btn">হোম পেজে ফিরে যান</a>
    </div>

</body>
</html>
